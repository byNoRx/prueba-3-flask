<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <form method="post">
        <h1>Formulario de Notas</h1>
        <label for="nota1">Nota 1:<br>
             <input id="nota1" name="nota1" type="number" min="10" max="70" value="{{ nota1 }}" required>
        </label><br>
        <label for="nota2">Nota 2:<br>
             <input id="nota2" name="nota2" type="number" min="10" max="70" value="{{ nota2 }}" required>
        </label><br>
        <label for="nota3">Nota 3:<br>
             <input id="nota3" name="nota3" type="number" min="10" max="70" value="{{ nota3 }}" required>
        </label><br>
        <label for="asistencia">Asistencia (%):<br>
             <input id="asistencia" name="asistencia" type="number" min="0" max="100" value="{{ asistencia }}" required>
        </label><br>
        <input class="button" type="submit" value="Enviar">

        <p>{{ promedio }}</p>
        <p>{{ estado }}</p>
    </form>
</body>
</html>
